# Локальный полный стек: Spring Boot (профиль local, H2) + статика фронта (nginx).
# Инфра (Postgres/Redis) — в docker-compose.yml; JWT выдаёт Supabase в облаке.
#
# Запуск:  docker compose -f docker-compose.dev.yml up --build
# UI:      http://localhost:5173
# API:     http://localhost:8080

services:
  backend:
    build:
      context: .
      dockerfile: liveimprove-app/Dockerfile
    container_name: liveimprove-app-dev
    environment:
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api/v1
    container_name: liveimprove-frontend-dev
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started
