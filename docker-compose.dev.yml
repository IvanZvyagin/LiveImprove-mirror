# Только API (профиль local, H2). Фронт — отдельно npm run dev в frontend/, когда появится в репо.
#
# Запуск: docker compose -f docker-compose.dev.yml up -d --build
# Health: http://localhost:8080/actuator/health

services:
  backend:
    build:
      context: .
      dockerfile: liveimprove-app/Dockerfile
    container_name: liveimprove-app-dev
    environment:
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 45s
