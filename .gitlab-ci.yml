stages:
  - build
  - test
  - package

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2"

# Пути, при изменении которых нужны Gradle-сборка и тесты бэка
.backend_paths: &backend_paths
  - liveimprove-app/**/*
  - liveimprove-common/**/*
  - liveimprove-domain/**/*
  - liveimprove-auth/**/*
  - liveimprove-goals/**/*
  - liveimprove-habits/**/*
  - liveimprove-tasks/**/*
  - liveimprove-calendar/**/*
  - liveimprove-interviews/**/*
  - liveimprove-analytics/**/*
  - liveimprove-notification/**/*
  - liveimprove-infrastructure/**/*
  - build.gradle.kts
  - settings.gradle.kts
  - gradle/**/*
  - gradlew
  - gradlew.bat
  - liveimprove-app/Dockerfile
  - .dockerignore

# Только для Java/Gradle-джоб. Не класть в default — иначе frontend-джобы наследуют
# огромный кэш .gradle и падают по таймауту/диску на SaaS runner.
.gradle_job: &gradle_job
  image: eclipse-temurin:25-jdk
  tags:
    - saas-linux-medium-amd64
  interruptible: true
  before_script:
    - chmod +x ./gradlew
  cache:
    key:
      files:
        - build.gradle.kts
        - liveimprove-app/build.gradle.kts
    paths:
      - .gradle/caches/
      - .gradle/wrapper/

default:
  interruptible: true

build:
  stage: build
  <<: *gradle_job
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - changes: *backend_paths
      when: on_success
    - when: never
  script:
    - ./gradlew assemble -x test --no-daemon
  artifacts:
    name: "build-$CI_COMMIT_SHORT_SHA"
    paths:
      - "**/build/libs/*.jar"
      - "**/build/classes/"
      - "**/build/generated/"
    expire_in: 1 day

test:
  stage: test
  <<: *gradle_job
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - changes: *backend_paths
      when: on_success
    - when: never
  needs:
    - job: build
  script:
    - ./gradlew test --no-daemon
  artifacts:
    when: always
    reports:
      junit:
        - "**/build/test-results/test/TEST-*.xml"
    paths:
      - "**/build/reports/tests/"
    expire_in: 1 week

docker_build:
  stage: package
  tags:
    - saas-linux-medium-amd64
  interruptible: true
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - changes: *backend_paths
      when: manual
      allow_failure: true
    - when: never
  needs:
    - job: test
      artifacts: false
  variables:
    IMAGE_NAME: "$CI_REGISTRY_IMAGE/backend"
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
  script:
    - |
      DEST_ARGS="--destination $IMAGE_NAME:$CI_COMMIT_SHORT_SHA --destination $IMAGE_NAME:$CI_COMMIT_REF_SLUG"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] || [ -n "$CI_COMMIT_TAG" ]; then
        DEST_ARGS="$DEST_ARGS --destination $IMAGE_NAME:latest"
      fi
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/liveimprove-app/Dockerfile" \
        $DEST_ARGS \
        --cache=true \
        --cache-ttl=72h \
        --snapshot-mode=redo \
        --use-new-run

# --- Frontend (Node), только при изменениях во frontend или CI ---
# Важно: before_script и script GitLab выполняет в одном shell, cwd сохраняется.
# Поэтому cd frontend делаем ОДИН раз в before_script, в script — bare-команды.
.frontend_base:
  image: node:22-alpine
  tags:
    - saas-linux-medium-amd64
  interruptible: true
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: never
  before_script:
    - cd frontend
    - npm ci --no-audit --no-fund

frontend_lint:
  extends: .frontend_base
  stage: build
  needs: []
  script:
    - npm run lint

frontend_build:
  extends: .frontend_base
  stage: build
  needs: []
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 day

frontend_test:
  extends: .frontend_base
  stage: test
  needs:
    - job: frontend_build
  script:
    - npm run test:run
