spring:
  application:
    name: liveimprove
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: false

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    root: INFO
    com.liveimprove: DEBUG

# Базовое значение; профиль dev переопределяет в application-dev.yml
app:
  security:
    enabled: false

# --- Supabase JWT (профиль dev; детали в liveimprove-auth/application.yml) ---
# Задайте в окружении при запуске Spring:
#   SUPABASE_ISSUER_URI=https://<project-ref>.supabase.co/auth/v1   (без слеша в конце; совпадает с iss в токене)
#   FRONTEND_ORIGIN=http://localhost:5173
