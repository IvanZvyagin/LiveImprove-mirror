app:
  security:
    enabled: true
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/liveimprove}
    username: ${DB_USER:appuser}
    password: ${DB_PASSWORD:apppass}
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
