# Профиль dev: JWT (Supabase) + Postgres + Redis. Без Keycloak.
# SUPABASE_ISSUER_URI — без слеша в конце; совпадает с iss в access token (jwt.io).
# FRONTEND_ORIGIN — origin фронта для CORS.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_ISSUER_URI:https://pevipmeoruuxqtdraqvr.supabase.co/auth/v1}
          jwk-set-uri: ${SUPABASE_ISSUER_URI:https://pevipmeoruuxqtdraqvr.supabase.co/auth/v1}/.well-known/jwks.json
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/liveimprove}
    username: ${DB_USER:appuser}
    password: ${DB_PASSWORD:apppass}
  jpa:
    hibernate:
      ddl-auto: validate
  # Миграции пока не добавлены в репозиторий; включайте после появления db/changelog
  liquibase:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  security:
    enabled: true
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
